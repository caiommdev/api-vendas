spring.application.name=gateway

spring.cloud.gateway.server.webflux.discovery.locator.enabled=true
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true

server.port=8085
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Mesmo segredo usado pelo auth-service (config-repo/auth-service.properties)
# para assinar os JWTs -- o gateway precisa dele para validar os tokens.
jwt.secret=falaapp-shared-dev-secret-key-troque-isso-em-producao-0123456789
